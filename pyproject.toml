[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slurm-monitor"
version = "0.1.0"
description = "Autonomous Slurm cluster monitoring and remediation agent"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
slurm-monitor = "slurm_monitor.cli:main"

[tool.setuptools.packages.find]
include = ["slurm_monitor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
