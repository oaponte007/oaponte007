[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coastal-hpc-tools"
version = "0.1.0"
description = "Coastal HPC cluster tooling: slurm-monitor (controller-side Slurm remediation agent) and chpc (per-node health checker for Slurm/PBS/PBS Pro)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
slurm-monitor = "slurm_monitor.cli:main"
chpc = "chpc.cli:main"

[tool.setuptools.packages.find]
include = ["slurm_monitor*", "chpc*"]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_chpc"]
