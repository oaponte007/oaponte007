name: Release Billing Statement Builder

# Deliberately separate from build-billing-exe.yml (which builds a fresh
# exe as a throwaway workflow artifact on every push, for our own dev
# iteration) rather than sharing one workflow gated by ref type: a version
# tag should always build and publish regardless of which paths changed,
# and GitHub's push-trigger `paths` filter is unreliable for tag pushes
# (a tag pointing at an already-pushed commit has no useful diff to filter
# on), so mixing the two triggers in one `on.push` block is a known
# footgun. This is the one that produces the stable, customer-facing
# download: see README's "This file is dangerous" section for why a
# fresh build on every push (the *other* workflow) is close to the worst
# case for browser/Windows reputation warnings, and a single, repeatedly-
# downloaded release asset is the fix that doesn't require a certificate.

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write  # softprops/action-gh-release needs this to create the release

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: billing-statement-builder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pywin32/pefile are only needed by pyinstaller's --version-file
          # support below, not by the app itself.
          pip install -r requirements.txt pyinstaller pywin32 pefile

      - name: Decode bundled assets and build app_icon.ico (assets are
          kept as base64 text in the repo so Windows checkout
          line-ending conversion can never corrupt the binary files)
        run: |
          python decode_assets.py
          python make_icon.py

      - name: Build exe
        run: |
          # The logo (and therefore app_icon.ico) is optional cosmetic
          # branding -- only pass --icon / bundle it if make_icon.py
          # actually produced one (it's committed as base64; skip
          # gracefully if that hasn't been added yet).
          $extraArgs = @()
          if (Test-Path "app_icon.ico") { $extraArgs += @("--icon", "app_icon.ico") }
          if (Test-Path "coastal_hpc_logo.png") { $extraArgs += @("--add-data", "coastal_hpc_logo.png;.") }
          pyinstaller --onefile --noconsole --name "Coastal HPC Billing Statement Builder" `
            --version-file version_info.txt `
            --add-data "Jo-Wayne_Billing_Statement_Template.docx;." `
            @extraArgs `
            billing_app.py

      - name: Publish GitHub Release with the exe attached
        uses: softprops/action-gh-release@v2
        with:
          files: "billing-statement-builder/dist/Coastal HPC Billing Statement Builder.exe"
          generate_release_notes: true
