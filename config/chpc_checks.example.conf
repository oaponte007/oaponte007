# chpc checks file -- one check per line:
#
#   <hostmask> || <builtin_check_name> [--flag value ...]
#   <hostmask> || command || <any shell command line>
#
# hostmask is matched against this host's hostname with shell-glob
# semantics ("*" = all hosts, "gpu*" = only hosts starting with "gpu"),
# so one checks.conf can be pushed to every node via Ansible/Puppet/Warewulf
# and each node only evaluates the lines that apply to it.
#
# Lines starting with # are comments. Full flag reference for every
# builtin check is in CHPC_MANUAL.md.

# --- baseline-referenced checks (compare live state to what `chpc install`
#     captured for THIS node -- these only fire if a baseline was captured) ---
*     || check_real_memory --tolerance-percent 2
*     || check_cpu_count --tolerance 0

# --- general health, no baseline needed ---
*     || check_load_average --max-per-core 1.5
*     || check_disk_usage --path / --max-percent 90
*     || check_disk_usage --path /tmp --max-percent 95
*     || check_swap_usage --max-percent 50
*     || check_zombie_processes --max 5

# --- filesystem/network, edit paths/interfaces for your site ---
# *   || check_mount_present --path /scratch --fstype nfs
# *   || check_mount_present --path /home --fstype nfs4
# *   || check_network_interface --iface ib0

# --- only on GPU nodes (edit the hostmask to match your naming) ---
# gpu*  || check_gpu_count

# --- the generic escape hatch: any shell command, exit 0 = pass.
#     Good for site-specific health scripts NHC users are used to writing. ---
# *   || command || /usr/local/sbin/site_healthcheck.sh
# *   || command || test -x /usr/local/cuda/bin/nvcc
